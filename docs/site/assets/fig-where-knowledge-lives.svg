<text x="835" y="318" text-anchor="middle" class="k">EACH RECORD CARRIES ITS SOURCE</text>
<text x="600" y="356" class="t">✓&#160; Read any single fact.</text><text x="600" y="386" class="t">✓&#160; Correct or delete one, in milliseconds.</text><text x="600" y="416" class="t">✓&#160; Ask where it came from, and get an answer.</text><text x="600" y="446" class="t">✓&#160; Most questions never reach a model at all.</text>
