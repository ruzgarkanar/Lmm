<text x="275" y="318" text-anchor="middle" class="k">ONE UNDIFFERENTIATED BLOCK</text>
<text x="40" y="356" class="t">✕&#160; You cannot point at a single fact.</text><text x="40" y="386" class="t">✕&#160; You cannot correct one without retraining.</text><text x="40" y="416" class="t">✕&#160; You cannot ask where it came from.</text><text x="40" y="446" class="t">✕&#160; Every answer reads the whole block.</text>
<text x="40" y="500" class="b">The bill: a data centre, and a sentence with no source.</text>
<text x="600" y="96" class="g">LMM</text>
<text x="600" y="124" class="t">Knowledge is kept as records you can read.</text>
