[build-system]
requires = ["setuptools>=77"]        # >=77 for the PEP 639 license fields
build-backend = "setuptools.build_meta"

[project]
name = "living-memory-model"
version = "0.1.0"
description = "A verifiable memory layer for language models: facts in a graph, sources on every claim, and a gate unsupported answers cannot pass."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "Rüzgar Kanar" }]
keywords = [
    "rag", "retrieval", "knowledge-graph", "llm", "memory",
    "hallucination", "grounding", "provenance", "question-answering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

# THE CORE INSTALL HAS NO DEPENDENCIES, and that is a design statement rather
# than an accident. The graph, the gate, the trust ordering, the transitive
# derivation and the evidence index are pure python and need neither a model
# nor a network — which is exactly why the whole discrete layer can be tested
# without a GPU. Readers and engines are opt-in below.
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10", "pypdf>=3.9"]
xlsx = ["pandas>=1.3", "openpyxl>=3.0"]
docx = ["python-docx>=1.0"]
local = ["torch>=2.0", "transformers>=4.40", "peft>=0.10", "accelerate>=0.28"]
gguf = ["llama-cpp-python>=0.2"]
openai = ["openai>=1.0"]
azure = ["openai>=1.0"]
docs-all = ["living-memory-model[pdf,xlsx,docx]"]

[project.urls]
Homepage = "https://github.com/ruzgarkanar/Lmm"
Repository = "https://github.com/ruzgarkanar/Lmm"
Issues = "https://github.com/ruzgarkanar/Lmm/issues"
Changelog = "https://github.com/ruzgarkanar/Lmm/blob/main/CHANGELOG.md"

[project.scripts]
lmm = "lmm.chat:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lmm*"]

# No py.typed: the package carries no annotations, and shipping the marker
# would promise type information that is not there.
